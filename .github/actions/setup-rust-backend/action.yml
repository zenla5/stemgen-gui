name: Setup Rust backend

description: |
  Shared setup for Rust backend jobs. Builds the frontend and copies the sidecar
  resource (required by tauri-codegen and the Tauri build script respectively),
  installs the Linux system dependencies (webkit/gtk stack), sets up the given
  Rust toolchain, and caches Cargo dependencies for the src-tauri workspace.
  Used by both the `backend` and `msrv` CI jobs so the build environment cannot
  drift between them.

inputs:
  rust-toolchain:
    description: Rust toolchain version to install (e.g. "stable" or "1.89.0")
    required: true
    default: stable

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install frontend dependencies
      run: npm ci
      shell: bash

    - name: Build frontend
      run: npm run build
      shell: bash
      env:
        VITE_BUILD_DATE: ${{ github.event.repository.updated_at }}

    - name: Copy sidecar resource
      run: npm run copy-sidecar
      shell: bash

    - name: Install Rust ${{ inputs.rust-toolchain }}
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Enable universe repository
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Recover from apt lock contention on shared runners, then add the
        # optional "universe" repos under a bounded timeout (it has been
        # observed to hang indefinitely and burn the whole job timeout).
        sudo pkill -9 apt-get 2>/dev/null || true
        sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock
        sudo dpkg --configure -a || true
        timeout 120 sudo add-apt-repository universe -y 2>/dev/null || true

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo pkill -9 apt-get 2>/dev/null || true
        sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock
        sudo dpkg --configure -a || true
        for i in 1 2 3; do sudo apt-get update -y && break; sleep 10; done
        for i in 1 2 3; do
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            ffmpeg \
            libayatana-appindicator3-dev && break
          sleep 10
        done

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri
