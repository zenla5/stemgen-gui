name: Verify Branch Protection

# Detects drift between the LIVE branch-protection policy on `main` and the
# SCRIPTED policy in .github/scripts/apply-branch-protection.sh (issue #204).
#
# Branch protection is a repository-settings change that CI cannot apply, so
# this is the only thing that can surface drift (e.g. a required status check
# renamed, `strict` toggled, or approval count changed) without a maintainer
# manually re-verifying.
#
# Token: reading branch protection requires more than the default GITHUB_TOKEN.
# The workflow uses the BRANCH_PROTECTION_PAT repository secret (PAT with
# `repo` / `admin:repo` scope). On scheduled runs, if that secret is absent the
# verify step skips itself (so a missing secret doesn't turn the weekly run
# red); a manual workflow_dispatch run always attempts the check.

on:
  schedule: # weekly, Sunday 03:17 UTC
    - cron: '17 3 * * 0'
  workflow_dispatch: # manual trigger

permissions:
  contents: read

concurrency:
  group: verify-branch-protection
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Branch Protection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || github.token }}
      # Whether the admin:repo PAT secret is configured (used by the script to
      # decide whether a scheduled run can read live protection).
      BRANCH_PROTECTION_PAT_CONFIGURED: ${{ secrets.BRANCH_PROTECTION_PAT != '' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify live branch protection matches scripted policy
        run: .github/scripts/verify-branch-protection.sh