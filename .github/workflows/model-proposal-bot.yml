name: Model Proposal Bot

# Scans for new community-adopted stem-separation models (issue #266) and files
# one proposal issue per candidate for maintainer triage. The bot is propose-only:
# it never adds a model to the app.
#
# Discovery + adoption gate live in python/model_proposal_bot.py (see the
# maintained allowlist in python/model_allowlist.json). The script runs on the
# default GITHUB_TOKEN with `issues: write` - enough to create/close issues and
# to create the `model-proposal` label idempotently.
#
# Rate/spam safety: the script caps issue creation per run (--max-issues 3),
# sleeps between creations, dedupes against the existing model catalog and open
# proposal issues, and closes stale `awaiting-triage` proposals (--handle-stale).
#
# Runs weekly; use workflow_dispatch for a manual scan.

on:
  schedule: # weekly, Monday 04:17 UTC
    - cron: '17 4 * * 1'
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: model-proposal-bot
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  scan:
    name: Scan for new stem-separation models
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install discovery dependencies
        # Pinned so the HF API surface (list_models kwargs, ModelInfo fields)
        # matches the version the script and its tests target. The local .venv
        # is not used in CI.
        run: pip install huggingface_hub==1.29.0

      - name: Discover and file model proposals
        run: cd python && python model_proposal_bot.py --repo "$GITHUB_REPOSITORY" --handle-stale
