name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# SHA-pinned actions should be updated periodically (e.g., quarterly or via Dependabot).
# Current pin date: 2026-04-01

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Build Windows release
        run: |
          echo "=== Creating Windows installers ==="
          npx tauri build --bundles msi,nsis --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -File "$env:TEMP\tauri-build.log"
          $exitCode = $LASTEXITCODE
          echo ""
          echo "=== Tauri build exit code: $exitCode ==="
          Get-Content "$env:TEMP\tauri-build.log" -Tail 80
          echo ""
          echo "=== Checking for produced bundles ==="
          $msiFile = Get-ChildItem "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle\msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsisFile = Get-ChildItem "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle\nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msiFile -and -not $nsisFile) {
            echo "ERROR: No bundle files produced!"
            if (Test-Path "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle") {
              Get-ChildItem "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle" -Recurse -File | Select-Object FullName
            } else {
              echo "No bundle directory found"
              echo "=== Listing target directory ==="
              Get-ChildItem "${{ github.workspace }}\target" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            }
            exit 1
          }
          echo "Bundles found:"
          if ($msiFile) { echo "  MSI: $($msiFile.FullName)" }
          if ($nsisFile) { echo "  NSIS: $($nsisFile.FullName)" }
          if ($exitCode -ne 0) { exit $exitCode }
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
      - name: Verify build outputs
        run: |
          echo "=== Release binary ==="
          $exe = "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\Stemgen-GUI.exe"
          if (Test-Path $exe) {
            Get-Item $exe | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Host "WARNING: No Stemgen-GUI.exe found"
            Get-ChildItem "${{ github.workspace }}\target" -Filter "*.exe" -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          }
          echo ""
          echo "=== Bundle directory ==="
          $bundleDir = "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle"
          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "WARNING: No bundle directory found"
          }
      - name: Verify sidecar resource is bundled (Windows)
        run: |
          echo "=== Checking sidecar in NSIS installer ==="
          $nsisExe = Get-ChildItem "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle\nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisExe) {
            $nsisDir = "${{ github.workspace }}\nsis-check"
            New-Item -ItemType Directory -Path $nsisDir -Force | Out-Null
            & 7z x $nsisExe.FullName -o$nsisDir -y | Out-Null
            if (Test-Path "$nsisDir\stemgen_sidecar.py") {
              echo "PASS: stemgen_sidecar.py found in NSIS installer"
            } else {
              echo "FAIL: stemgen_sidecar.py NOT found in NSIS installer"
              echo "Contents of extracted NSIS:"
              Get-ChildItem $nsisDir -Recurse -File | Select-Object FullName
              exit 1
            }
          } else {
            echo "WARNING: No NSIS installer found to check"
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/Stemgen-GUI.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build macOS release
        run: |
          echo "=== Building macOS installer ==="
          npx tauri build --bundles app --target aarch64-apple-darwin 2>&1 | tee /tmp/tauri-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Tauri build exit code: $EXIT_CODE ==="
          tail -80 /tmp/tauri-build.log
          echo ""
          echo "=== Checking for .app bundle ==="
          find "$GITHUB_WORKSPACE/target" -name "*.app" -type d 2>/dev/null | head -10
          if [ $EXIT_CODE -ne 0 ]; then exit $EXIT_CODE; fi
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
      - name: Find and package .app bundle
        id: package
        run: |
          echo "=== Searching for .app bundle ==="
          APP_DIR=$(find "$GITHUB_WORKSPACE/target" -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "ERROR: No .app bundle found"
            echo "=== Listing target directory ==="
            ls -la "$GITHUB_WORKSPACE/target/" 2>/dev/null | head -20
            echo "=== Full target tree ==="
            find "$GITHUB_WORKSPACE/target" -type d 2>/dev/null | head -40
            exit 1
          fi
          echo "Found: $APP_DIR"
          echo ""
          echo "=== Packaging .app as zip ==="
          cd "$(dirname "$APP_DIR")"
          ZIP_NAME="$(basename "$APP_DIR" .app | tr ' ' '_').zip"
          echo "Creating $ZIP_NAME..."
          zip -r "$ZIP_NAME" "$(basename "$APP_DIR")"
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: zip failed"
            exit 1
          fi
          ls -lh "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | head -5
          echo ""
          echo "=== Copy zip to workspace root with .dmg extension ==="
          VERSION=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          DMG_NAME="Stemgen-GUI_${VERSION}_aarch64.dmg"
          cp "$ZIP_NAME" "$GITHUB_WORKSPACE/$DMG_NAME"
          echo "Copied to: $GITHUB_WORKSPACE/$DMG_NAME"
          echo "dmg_file=$DMG_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify sidecar resource is bundled (macOS)
        run: |
          echo "=== Checking sidecar in .app bundle ==="
          APP_DIR=$(find "$GITHUB_WORKSPACE/target" -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app bundle found"
            exit 1
          fi
          SIDECAR_PATH="$APP_DIR/Contents/Resources/stemgen_sidecar.py"
          if [ -f "$SIDECAR_PATH" ]; then
            echo "PASS: stemgen_sidecar.py found in .app bundle at $SIDECAR_PATH"
          else
            echo "FAIL: stemgen_sidecar.py NOT found at $SIDECAR_PATH"
            echo "Contents of Resources dir:"
            ls -la "$APP_DIR/Contents/Resources/" 2>/dev/null || echo "Resources dir not found"
            exit 1
          fi
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm-artifacts
          path: |
            target/aarch64-apple-darwin/release/bundle/macos/
            target/aarch64-apple-darwin/release/Stemgen-GUI
            ${{ github.workspace }}/${{ steps.package.outputs.dmg_file }}
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config libasound2-dev libgtk-3-dev \
            libgdk-pixbuf2.0-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libglib2.0-dev libcairo2-dev \
            libayatana-appindicator3-dev libdbus-1-dev ffmpeg zip \
            patchelf librsvg2-dev
      - name: Install dependencies
        run: npm ci
      - name: Build Linux release
        run: |
          echo "=== Creating Linux installers ==="
          echo "=== System info ==="
          echo "OS: $(uname -a)"
          echo "Disk space: $(df -h / | tail -1)"
          echo "patchelf: $(patchelf --version 2>&1 || echo 'NOT FOUND')"
          echo "appimagetool: $(which appimagetool 2>&1 || echo 'NOT FOUND')"
          echo ""
          npx tauri build --bundles deb,appimage,rpm -v 2>&1 | tee /tmp/tauri-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Tauri build exit code: $EXIT_CODE ==="
          tail -120 /tmp/tauri-build.log
          echo ""
          echo "=== Checking for produced bundles ==="
          DEB_FILE=$(find "$GITHUB_WORKSPACE/target/release/bundle/deb" -name "*.deb" 2>/dev/null | head -1)
          APPIMAGE_FILE=$(find "$GITHUB_WORKSPACE/target/release/bundle/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          RPM_FILE=$(find "$GITHUB_WORKSPACE/target/release/bundle/rpm" -name "*.rpm" 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ] && [ -z "$APPIMAGE_FILE" ] && [ -z "$RPM_FILE" ]; then
            echo "ERROR: No bundle files produced!"
            echo "=== Workspace target dir ==="
            ls -la "$GITHUB_WORKSPACE/target/" 2>/dev/null || echo "No target directory"
            echo "=== Full target tree ==="
            find "$GITHUB_WORKSPACE/target" -type d 2>/dev/null | head -30
            echo "=== Bundle directories ==="
            ls -laR "$GITHUB_WORKSPACE/target/release/bundle/" 2>/dev/null || echo "No bundle directory"
            exit 1
          fi
          echo "Bundles found:"
          [ -n "$DEB_FILE" ] && echo "  DEB: $DEB_FILE"
          [ -n "$APPIMAGE_FILE" ] && echo "  AppImage: $APPIMAGE_FILE"
          [ -n "$RPM_FILE" ] && echo "  RPM: $RPM_FILE"
          if [ $EXIT_CODE -ne 0 ]; then exit $EXIT_CODE; fi
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
      - name: Verify build outputs
        run: |
          echo "=== Release binary ==="
          if [ -f "$GITHUB_WORKSPACE/target/release/stemgen-gui" ]; then
            ls -lh "$GITHUB_WORKSPACE/target/release/stemgen-gui"
          else
            echo "WARNING: No stemgen-gui binary found"
            ls -la "$GITHUB_WORKSPACE/target/release/" 2>/dev/null | head -20
          fi
          echo ""
          echo "=== Bundle directory ==="
          ls -la "$GITHUB_WORKSPACE/target/release/bundle/" 2>/dev/null || echo "No bundle directory"
          echo ""
          echo "=== Package files ==="
          find "$GITHUB_WORKSPACE/target/release" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec ls -lh {} \; 2>/dev/null || echo "No package files found"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/stemgen-gui
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Version consistency check (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tagged version: $VERSION"
          if ! grep -q "\"version\": \"$VERSION\"" package.json; then
            echo "Error: package.json version does not match tag $VERSION"
            exit 1
          fi
          echo "package.json version matches tag"
          if ! grep -q "version = \"$VERSION\"" src-tauri/Cargo.toml; then
            echo "Error: src-tauri/Cargo.toml version does not match tag $VERSION"
            exit 1
          fi
          echo "src-tauri/Cargo.toml version matches tag"
      - name: Validate README download links
        run: |
          echo "=== Checking README download section ==="
          # Ensure download links use /releases/latest (not hardcoded versions)
          if grep -nE 'releases/download/v[0-9]' README.md; then
            echo "ERROR: README contains hardcoded version download links."
            echo "Download links must use /releases/latest to avoid going stale."
            exit 1
          fi
          # Ensure download section header exists
          if ! grep -q '### Latest Release' README.md; then
            echo "ERROR: README missing '### Latest Release' section"
            exit 1
          fi
          echo "README download links OK"
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: |
          echo "=== All artifact files ==="
          find artifacts -type f 2>/dev/null || echo "No artifacts found"
      - name: Generate SHA256 checksums
        run: |
          echo "=== Generating SHA256 checksums ==="
          if [ ! -d "artifacts" ]; then
            echo "ERROR: artifacts directory does not exist"
            exit 1
          fi
          cd artifacts || exit 1
          find . -type f | while IFS= read -r file; do
            echo "Hashing: $file"
            shasum -a 256 "$file" >> SHA256SUMS.txt
          done
          if [ -s SHA256SUMS.txt ]; then
            echo "Checksums generated:"
            cat SHA256SUMS.txt
          else
            echo "ERROR: No artifact files found"
            find . -type f | head -20
            exit 1
          fi
      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256-checksums
          path: artifacts/SHA256SUMS.txt
          retention-days: 30
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Strip leading 'v' if present (e.g., input "v1.1.0" -> "1.1.0")
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
      - name: Generate Tauri update manifests
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p artifacts
          MANIFEST="{\"name\":\"Stemgen GUI\",\"version\":\"$VERSION\",\"notes\":\"Stemgen GUI v$VERSION\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"apple\":{\"url\":\"https://github.com/zenla5/stemgen-gui/releases/download/v$VERSION/Stemgen-GUI_${VERSION}_aarch64.dmg\",\"isDarkModeSupported\":true},\"windows\":{\"url\":\"https://github.com/zenla5/stemgen-gui/releases/download/v$VERSION/Stemgen-GUI_${VERSION}_x64-setup.exe\",\"isDarkModeSupported\":true},\"linux\":{\"url\":\"https://github.com/zenla5/stemgen-gui/releases/download/v$VERSION/Stemgen-GUI_${VERSION}_amd64.AppImage\"}}"
          echo "$MANIFEST" > artifacts/latest.json
          echo "Latest manifest:"
          cat artifacts/latest.json
      - name: Sign update manifests (if secrets available)
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        run: |
          if [ -n "$TAURI_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PASSWORD" ]; then
            echo "Signing update manifests..."
            npx @tauri-apps/cli@latest signer sign --private-key "$TAURI_PRIVATE_KEY" --password "$TAURI_SIGNING_PASSWORD" artifacts/latest.json
            echo "Manifest signed."
          else
            echo "WARNING: TAURI_PRIVATE_KEY or TAURI_SIGNING_PASSWORD not set — manifests unsigned."
          fi
      - name: Upload update manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-manifests
          path: artifacts/latest.json
          retention-days: 365
      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.zip
            artifacts/**/SHA256SUMS.txt
            artifacts/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Failure notification via Telegram
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-windows, build-macos, build-linux, release]
    if: failure()
    steps:
      - name: Send Telegram notification
        run: |
          TEXT=$(printf "🔴 *Release Pipeline Failed*\n*Repo:* %s\n*Branch:* %s\n*Commit:* \`%s\`\n*Triggered by:* %s\n[View Run](https://github.com/%s/actions/runs/%s)" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" \
            "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$TEXT"
