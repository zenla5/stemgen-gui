name: CI

on:
  push:
    branches: [main, develop, '**']
  pull_request:
    branches: [main, develop, '**']

# SHA-pinned actions should be updated periodically (e.g., quarterly or via Dependabot).
# Current pin date: 2026-04-01

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Frontend tests and linting
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Check coverage thresholds
        run: |
          echo "=== Coverage Report Summary ==="
          echo "Thresholds: lines 38%, functions 60%, branches 63%, statements 38%"
          echo "If thresholds are not met, CI will fail here."

  # Frontend integration tests (React component tests)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (component rendering tests)
        run: npm run test:integration

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: integration-test-results
          path: |
            test-results/
          retention-days: 7

  # E2E tests - Playwright tests with built-in dev server
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Rust backend: clippy, fmt, build, and tests
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable universe repository
        run: sudo add-apt-repository universe -y

      - name: Install system dependencies (Tauri + FFmpeg for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            ffmpeg \
            libayatana-appindicator3-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: |
          cd src-tauri && cargo fmt --check
        env:
          RUST_BACKTRACE: 1

      - name: Clippy linting (blocking)
        run: |
          cd src-tauri && cargo clippy --lib --bins -- -D warnings
        env:
          RUST_BACKTRACE: 1

      - name: Build release
        run: |
          cd src-tauri && cargo build --release --features devtools
          echo "Build exit code: $?"

      - name: Run Rust tests
        run: |
          echo "=== Running cargo test --lib (library tests only) ==="
          cd src-tauri && cargo test --lib 2>&1
          echo "Test exit code: $?"

      - name: Run Rust integration tests
        run: |
          echo "=== Running cargo test --tests (integration tests) ==="
          cd src-tauri && cargo test --tests 2>&1
          echo "Integration test exit code: $?"

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run cargo-audit
        run: cargo install cargo-audit && cargo audit || true
        continue-on-error: true

  # Binary E2E tests — drives the compiled Tauri binary via CDP
  e2e-binary:
    name: Binary E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable universe repository
        if: runner.os == 'Linux'
        run: sudo add-apt-repository universe -y

      - name: Install system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Build release binary
        run: cd src-tauri && cargo build --release --features devtools

      # Linux: WebdriverIO + tauri-driver
      - name: Install tauri-driver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Run binary E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx wdio run wdio.conf.ts
        env:
          CI: true

      # Windows: Playwright + CDP
      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install --with-deps chromium

      - name: Run binary E2E tests (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test --project=binary
        env:
          CI: true
          CDP_PORT: 9515

      - name: Upload binary test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: binary-e2e-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Final check
  check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, integration, backend, e2e, e2e-binary, security]
    if: always()

    steps:
      - name: Verify core jobs passed
        run: |
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "cancelled" ]]; then
            echo "Frontend tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "cancelled" ]]; then
            echo "Integration tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "cancelled" ]]; then
            echo "Backend tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "cancelled" ]]; then
            echo "E2E tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "failure" ]]; then
            echo "Binary E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "cancelled" ]]; then
            echo "Binary E2E tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "skipped" ]]; then
            echo "Binary E2E tests were skipped — this should not happen on CI"
            exit 1
          fi
          echo "All critical checks passed!"

  # Failure notification via Telegram
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, integration, backend, e2e, e2e-binary, check]
    if: failure()
    steps:
      - name: Send Telegram notification
        run: |
          TEXT=$(printf "🔴 *CI Pipeline Failed*\n*Repo:* %s\n*Branch:* %s\n*Commit:* \`%s\`\n*Triggered by:* %s\n[View Run](https://github.com/%s/actions/runs/%s)" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" \
            "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$TEXT"
