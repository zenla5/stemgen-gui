name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main, develop, '**']

# SHA-pinned actions should be updated periodically (e.g., quarterly or via Dependabot).
# Current pin date: 2026-04-01

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Frontend tests and linting
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Check coverage thresholds
        run: |
          echo "=== Coverage Report Summary ==="
          echo "Thresholds: lines 55%, functions 72%, branches 75%, statements 55%"
          echo "If thresholds are not met, CI will fail here."

  # Python sidecar tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: pip install -r python/requirements-dev.txt

      - name: Install runtime deps for import verification
        run: pip install soundfile

      - name: Verify runtime imports
        run: python -c "import soundfile; print('Deps OK')"

      - name: Run Python tests with coverage
        run: cd python && pytest tests/ -m "not integration" --tb=short -v --cov=stemgen_sidecar --cov-report=term-missing --cov-fail-under=40

      - name: Upload pytest output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: python-test-results
          path: |
            python/.pytest_cache/
          retention-days: 7

  # Frontend integration tests (React component tests)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (component rendering tests)
        run: npm run test:integration

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-test-results
          path: |
            test-results/
          retention-days: 7

  # E2E tests - Playwright tests with built-in dev server
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Rust backend: clippy, fmt, build, and tests (cross-platform)
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust backend (frontend + sidecar + system deps + toolchain)
        uses: ./.github/actions/setup-rust-backend
        with:
          rust-toolchain: stable

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Check Rust formatting
        run: cd src-tauri && cargo fmt --check
        env:
          RUST_BACKTRACE: 1

      - name: Clippy linting (blocking)
        run: cd src-tauri && cargo clippy --lib --bins -- -D warnings
        env:
          RUST_BACKTRACE: 1

      - name: Build release
        run: cd src-tauri && cargo build --release --features devtools
        env:
          RUST_BACKTRACE: 1

      - name: Run Rust tests
        run: cd src-tauri && cargo test --lib 2>&1
        env:
          RUST_BACKTRACE: 1

      - name: Run Rust integration tests
        run: cd src-tauri && cargo test --tests 2>&1
        env:
          RUST_BACKTRACE: 1

  # MSRV check — verifies the crate still builds on the declared rust-version
  # so dependency upgrades cannot silently raise the MSRV.
  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust backend (frontend + sidecar + system deps + toolchain)
        uses: ./.github/actions/setup-rust-backend
        with:
          rust-toolchain: 1.89.0

      - name: Check MSRV build
        run: cd src-tauri && cargo check --workspace
        env:
          RUST_BACKTRACE: 1

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run cargo-audit
        run: cargo install cargo-audit && cargo audit || true
        continue-on-error: true

  # Binary E2E tests — drives the compiled Tauri binary via CDP
  e2e-binary:
    name: Binary E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Copy sidecar resource
        run: npm run copy-sidecar

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable universe repository
        if: runner.os == 'Linux'
        run: |
          sudo pkill -9 apt-get 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true
          timeout 120 sudo add-apt-repository universe -y 2>/dev/null || true

      - name: Install system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo pkill -9 apt-get 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true
          for i in 1 2 3; do sudo apt-get update -y && break; sleep 10; done
          for i in 1 2 3; do
            sudo apt-get install -y \
              libssl-dev \
              pkg-config \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              webkit2gtk-driver && break
            sleep 10
          done

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Build release binary
        run: cd src-tauri && cargo build --release --features devtools

      # Linux: WebdriverIO + tauri-driver
      - name: Install tauri-driver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Run binary E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx wdio run wdio.conf.ts
        env:
          CI: true

      # Windows: Playwright + CDP against WebView2. The app opens the CDP port
      # itself (additional_browser_args, devtools builds) — see src-tauri/src/lib.rs.
      - name: Diagnose WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Report the installed WebView2 runtime and confirm the app opens its
          # in-code CDP port when launched directly (no env var involved).
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($root in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients','HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients','HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients') {
            $item = Get-ItemProperty (Join-Path $root $guid) -ErrorAction SilentlyContinue
            if ($item) { Write-Host "WebView2 Runtime version: $($item.pv)" }
          }
          $app = Join-Path $env:GITHUB_WORKSPACE 'target\release\stemgen-gui.exe'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'app-stderr.log'
          try {
            $p = Start-Process -FilePath $app -PassThru -RedirectStandardError $stderr
            Start-Sleep -Seconds 15
            $p.Refresh()
            Write-Host "Direct app launch: HasExited=$($p.HasExited) ExitCode=$(if($p.HasExited){$p.ExitCode}else{'still-running'})"
          } catch {
            Write-Host "Direct app launch FAILED: $($_.Exception.Message)"
          }
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:9515/json/version' -UseBasicParsing -TimeoutSec 5
            Write-Host "Direct app CDP reachable on 9515: HTTP $($r.StatusCode)"
          } catch {
            Write-Host "Direct app CDP NOT reachable on 9515: $($_.Exception.Message)"
          }
          if (Test-Path $stderr) { Write-Host '--- app-stderr.log (tail) ---'; Get-Content $stderr -Tail 40 }
          Stop-Process -Name stemgen-gui -Force -ErrorAction SilentlyContinue

      - name: Run binary E2E tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A recycled Microsoft Edge/WebView2 process can hold the profile lock;
          # clean stale processes before opening a fresh CDP session.
          Stop-Process -Name msedge,msedgewebview2,msedgewebview2rt -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          # Full Playwright suite is too slow to finish on WebView2 within the job
          # timeout, so Windows runs the reduced smoke suite (Linux runs the full
          # suite via WebdriverIO).
          npx playwright test --project=binary-smoke
        env:
          CI: 'true'

      - name: Upload binary test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: binary-e2e-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Changelog structure check
  changelog:
    name: Changelog Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate CHANGELOG structure
        run: node .github/scripts/check-changelog.mjs

  # Verifies the canonical core-CI-job list (the `check` job's `needs:` list)
  # has not drifted from the docs that reference it (issue #203).
  validate-core-job-list:
    name: Validate Core Job List
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check core job list is in sync across ci.yml and docs
        run: .github/scripts/verify-core-job-list.sh

  # Final check
  # NOTE: the 'needs' list below is the SINGLE source of truth for the core CI
  # jobs that form the merge gate. `notify-failure` depends only on this job,
  # and `.github/scripts/verify-core-job-list.sh` (run by the
  # `validate-core-job-list` job) asserts docs/CI_GATE.md and AGENT_GUIDE.md
  # match this list exactly (issue #203). Add/remove a gating job here AND in
  # the two docs, or CI fails.
  check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, integration, backend, e2e, e2e-binary, security, python, changelog, msrv]
    if: always()

    steps:
      - name: Verify core jobs passed
        run: |
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "cancelled" ]]; then
            echo "Frontend tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "cancelled" ]]; then
            echo "Integration tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "cancelled" ]]; then
            echo "Backend tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "cancelled" ]]; then
            echo "E2E tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "failure" ]]; then
            echo "Binary E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "cancelled" ]]; then
            echo "Binary E2E tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "skipped" ]]; then
            echo "Binary E2E tests were skipped — this should not happen on CI"
            exit 1
          fi
          if [[ "${{ needs.python.result }}" == "failure" ]]; then
            echo "Python tests failed"
            exit 1
          fi
          if [[ "${{ needs.python.result }}" == "cancelled" ]]; then
            echo "Python tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.changelog.result }}" == "failure" ]]; then
            echo "Changelog structure check failed"
            exit 1
          fi
          if [[ "${{ needs.changelog.result }}" == "cancelled" ]]; then
            echo "Changelog structure check was cancelled"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "Security audit failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" == "cancelled" ]]; then
            echo "Security audit was cancelled"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" == "failure" ]]; then
            echo "MSRV check failed"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" == "cancelled" ]]; then
            echo "MSRV check was cancelled"
            exit 1
          fi
          echo "All critical checks passed!"

  # Failure notification via Telegram
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    if: failure()
    steps:
      - name: Send Telegram notification
        run: |
          TEXT=$(printf "🔴 *CI Pipeline Failed*\n*Repo:* %s\n*Branch:* %s\n*Commit:* \`%s\`\n*Triggered by:* %s\n[View Run](https://github.com/%s/actions/runs/%s)" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" \
            "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$TEXT"
