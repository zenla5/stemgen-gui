name: CI

on:
  push:
    branches: [main, develop, '**']
  pull_request:
    branches: [main, develop, '**']

# SHA-pinned actions should be updated periodically (e.g., quarterly or via Dependabot).
# Current pin date: 2026-04-01

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Frontend tests and linting
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Check coverage thresholds
        run: |
          echo "=== Coverage Report Summary ==="
          echo "Thresholds: lines 55%, functions 72%, branches 75%, statements 55%"
          echo "If thresholds are not met, CI will fail here."

  # Python sidecar tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: pip install -r python/requirements-dev.txt

      - name: Install runtime deps for import verification
        run: pip install soundfile

      - name: Verify runtime imports
        run: python -c "import soundfile; print('Deps OK')"

      - name: Run Python tests with coverage
        run: cd python && pytest tests/ -m "not integration" --tb=short -v --cov=stemgen_sidecar --cov-report=term-missing --cov-fail-under=40

      - name: Upload pytest output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: python-test-results
          path: |
            python/.pytest_cache/
          retention-days: 7

  # Frontend integration tests (React component tests)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (component rendering tests)
        run: npm run test:integration

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-test-results
          path: |
            test-results/
          retention-days: 7

  # E2E tests - Playwright tests with built-in dev server
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Rust backend: clippy, fmt, build, and tests (cross-platform)
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_BUILD_DATE: ${{ github.event.repository.updated_at }}

      - name: Copy sidecar resource
        run: npm run copy-sidecar

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable universe repository
        if: runner.os == 'Linux'
        run: sudo add-apt-repository universe -y

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            ffmpeg \
            libayatana-appindicator3-dev

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cd src-tauri && cargo fmt --check
        env:
          RUST_BACKTRACE: 1

      - name: Clippy linting (blocking)
        run: cd src-tauri && cargo clippy --lib --bins -- -D warnings
        env:
          RUST_BACKTRACE: 1

      - name: Build release
        run: cd src-tauri && cargo build --release --features devtools
        env:
          RUST_BACKTRACE: 1

      - name: Run Rust tests
        run: cd src-tauri && cargo test --lib 2>&1
        env:
          RUST_BACKTRACE: 1

      - name: Run Rust integration tests
        run: cd src-tauri && cargo test --tests 2>&1
        env:
          RUST_BACKTRACE: 1

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run cargo-audit
        run: cargo install cargo-audit && cargo audit || true
        continue-on-error: true

  # Binary E2E tests — drives the compiled Tauri binary via CDP
  e2e-binary:
    name: Binary E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Copy sidecar resource
        run: npm run copy-sidecar

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable universe repository
        if: runner.os == 'Linux'
        run: sudo add-apt-repository universe -y

      - name: Install system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Build release binary
        run: cd src-tauri && cargo build --release --features devtools

      # Linux: WebdriverIO + tauri-driver
      - name: Install tauri-driver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Run binary E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx wdio run wdio.conf.ts
        env:
          CI: true

      # Windows: WebdriverIO + tauri-driver (same setup as Linux)
      - name: Install tauri-driver (Windows)
        if: runner.os == 'Windows'
        run: cargo install tauri-driver --locked

      - name: Run binary E2E tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $driverDir = Join-Path $env:GITHUB_WORKSPACE 'edge-driver-cache'
          $env:EDGEDRIVER_CACHE_DIR = $driverDir
          node -e "require('edgedriver').download()" | Out-Host
          if (-not (Test-Path (Join-Path $driverDir 'msedgedriver.exe'))) {
            Write-Error 'msedgedriver.exe was not provisioned for tauri-driver'
            exit 1
          }
          echo "$driverDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          npx wdio run wdio.windows.conf.ts
        env:
          CI: 'true'

      - name: Upload binary test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: binary-e2e-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Final check
  check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, integration, backend, e2e, e2e-binary, security, python]
    if: always()

    steps:
      - name: Verify core jobs passed
        run: |
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "cancelled" ]]; then
            echo "Frontend tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "cancelled" ]]; then
            echo "Integration tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "cancelled" ]]; then
            echo "Backend tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" == "cancelled" ]]; then
            echo "E2E tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "failure" ]]; then
            echo "Binary E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "cancelled" ]]; then
            echo "Binary E2E tests were cancelled"
            exit 1
          fi
          if [[ "${{ needs.e2e-binary.result }}" == "skipped" ]]; then
            echo "Binary E2E tests were skipped — this should not happen on CI"
            exit 1
          fi
          if [[ "${{ needs.python.result }}" == "failure" ]]; then
            echo "Python tests failed"
            exit 1
          fi
          if [[ "${{ needs.python.result }}" == "cancelled" ]]; then
            echo "Python tests were cancelled"
            exit 1
          fi
          echo "All critical checks passed!"

  # Failure notification via Telegram
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, integration, backend, e2e, e2e-binary, python, check]
    if: failure()
    steps:
      - name: Send Telegram notification
        run: |
          TEXT=$(printf "🔴 *CI Pipeline Failed*\n*Repo:* %s\n*Branch:* %s\n*Commit:* \`%s\`\n*Triggered by:* %s\n[View Run](https://github.com/%s/actions/runs/%s)" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" \
            "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$TEXT"
