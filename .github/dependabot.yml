# Please see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-github-api
# for all supported options.

version: 2
updates:
  # Rust/Tauri dependencies (Cargo workspace manifest at repo root)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main

  # Node/TypeScript dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main
    ignore:
      # TypeScript 7 is the new native (Go-based) compiler. Migration is tracked
      # in issue "Migrate to TypeScript 7" and remains blocked until the
      # @typescript-eslint toolchain supports TS 7 (peer cap is <6.1.0). Hide the
      # 7.x major from dependabot until that lands.
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      # react and react-dom must always move together (React hard-requires
      # identical versions and crashes every render-based suite otherwise, e.g.
      # PR #336 bumped react alone). Group the pair (+ their types) into a
      # single PR for minor/patch updates.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

  # Python sidecar dependencies
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: main